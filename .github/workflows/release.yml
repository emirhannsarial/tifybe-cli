name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          # Windows ARM64 is usually not required for standard CLIs
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than pinned here. A pinned version drifts
          # silently: adding a dependency can raise the go directive, and the
          # first sign is a release build that fails after the tag is already
          # pushed.
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          output_name=tifybe-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output_name+='.exe'
          fi
          go build -ldflags "-s -w -X github.com/emirhannsarial/tifybe-cli/cmd.Version=${GITHUB_REF_NAME}" -o $output_name ./cmd/tifybe
          sha256sum $output_name > $output_name.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: tifybe-*
          generate_release_notes: true
